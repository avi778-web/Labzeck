<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabZeck - Premium Dispatch Platform</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts (Inter & Caveat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    .cursive-heading {
      font-family: 'Caveat', cursive;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-purple-500 selection:text-white relative overflow-x-hidden">

  <!-- BACKGROUND VIDEO (Updated with public CDN fallback) -->
  <video 
    autoplay 
    loop 
    muted 
    playsinline 
    class="fixed inset-0 w-full h-full object-cover z-0 opacity-80"
  >
    <source src="https://motionbgs.com/media/9121/large-cherry-blossom-tree.960x540.mp4" type="video/mp4" />
  </video>

  <!-- DARK OVERLAY FOR CONTRAST -->
  <div class="fixed inset-0 bg-slate-950/40 z-0 pointer-events-none"></div>

  <!-- MAIN REACT APP ROOT -->
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState } = React;

    const LabZeckLogo = ({ className = "w-9 h-9" }) => (
      <svg className={className} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path 
          d="M 52,42 V 116 H 100" 
          stroke="#0052FF" 
          strokeWidth="38" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
        />
        <path 
          d="M 100,74 H 148 V 158 H 100" 
          stroke="#38BDF8" 
          strokeWidth="38" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
        />
      </svg>
    );

    function App() {
      const [openFaq, setOpenFaq] = useState(null);
      const [showModal, setShowModal] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const toggleFaq = (index) => {
        setOpenFaq(openFaq === index ? null : index);
      };

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const faqs = [
        {
          id: "faq-1",
          q: "How fast do job matches happen?",
          a: "Matches occur in real-time. Our geo-dispatch algorithm notifies qualified workers within your specified radius immediately upon posting."
        },
        {
          id: "faq-2",
          q: "Are all workers and employers background verified?",
          a: "Yes. Every worker undergoes multi-tiered identity verification, trade license checks, and optional background screening. Employers are vetted for business registration and payment safety."
        },
        {
          id: "faq-3",
          q: "How do payouts work for completed shifts?",
          a: "Payouts are released automatically upon shift completion and approval, directly into your designated bank account."
        },
        {
          id: "faq-4",
          q: "Is LabZeck available on Android and Web?",
          a: "Yes, LabZeck is accessible via both Web browsers and native mobile applications on Android and iOS."
        }
      ];

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* TOP NAVBAR */}
          <header className="max-w-7xl mx-auto w-full px-4 sm:px-8 py-5 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="p-1 rounded-xl bg-slate-900/60 backdrop-blur-md border border-white/20 shadow-sm flex items-center justify-center transform hover:scale-105 transition-transform">
                <LabzeckLogo className="w-9 h-9" />
              </div>
              <span className="text-2xl font-black tracking-wider text-white uppercase">
                Lab<span className="text-amber-400">zeck</span>
              </span>
            </div>

            {/* Desktop Navigation */}
            <nav className="hidden md:flex items-center gap-8 font-medium text-slate-300 text-sm">
              <a href="#faq" className="hover:text-white transition-colors">FAQ</a>
              <a href="#contact" className="hover:text-white transition-colors">Contact</a>
              <a href="privacy.html" className="hover:text-white transition-colors">Privacy Policy</a>
              <button 
                onClick={() => setShowModal(true)}
                className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2.5 rounded-full flex items-center gap-2 shadow-lg shadow-amber-500/20 transition-all hover:scale-105"
              >
                Download App 
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </button>
            </nav>

            {/* Mobile Menu Button */}
            <button 
              onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
              aria-expanded={mobileMenuOpen}
              className="md:hidden p-2 rounded-lg bg-slate-800/80 text-white border border-white/20 shadow-sm"
            >
              {mobileMenuOpen ? (
                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>

                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>

              >

            </div>

              <span className="text-3xl sm:text-5xl md:text-6xl font-extrabold text-white block">
                Built for skilled labor & employers.

            {/* Subtext */}
            <p className="max-w-2xl mx-auto text-slate-300 text-base sm:text-lg font-normal leading-relaxed mb-10">
              Instant geo-matching, background-verified tradesmen, and shift completion payouts transferred same day.

            {/* CTA Buttons */}
            <div className="flex flex-col sm:flex-row items-center justify-center gap-4">
              <button 
                onClick={() => setShowModal(true)}

              >
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span>Download App</span>
              </button>

              <a

                className="w-full sm:w-auto bg-slate-900/80 hover:bg-slate-800 text-white font-semibold px-7 py-3.5 rounded-full flex items-center justify-center gap-2 border border-white/20 shadow-md transition-all hover:-translate-y-0.5"
              >
                <span>Explore FAQ</span>
                <svg className="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>

            </div>

            {/* FAQ SECTION */}

                System FAQ

                      <span>

                      <div className={`w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 ml-4 transition-all duration-300 ${openFaq === idx ? 'bg-amber-400 text-slate-950 rotate-45' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>

                          <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                      </div>
                    </button>
                    
                    {openFaq === idx && (
                      <div className="px-5 pb-6 pt-1 text-slate-300 text-sm sm:text-base leading-relaxed border-t border-slate-700/50">
                        {faq.a}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </section>
          </main>

          {/* FOOTER */}
          <footer className="bg-slate-950/80 backdrop-blur-md border-t border-white/10 pt-12 pb-8 px-4 sm:px-8 mt-20">
            <div className="max-w-7xl mx-auto">
              <div className="grid grid-cols-1 md:grid-cols-12 gap-8 mb-12">
                
                {/* Brand Info & Social Links */}
                <div className="md:col-span-4 space-y-5">
                  <div className="flex items-center gap-2.5">
                    <div className="p-1 rounded-xl bg-slate-900 border border-white/10 shadow-sm flex items-center justify-center">
                      <LabzeckLogo className="w-8 h-8" />

                    <span className="text-xl font-extrabold tracking-wider text-white uppercase">
                      Lab<span className="text-amber-400">zeck</span>

                  </div>

                  <p className="text-slate-400 text-sm max-w-sm leading-relaxed">
                    The premium, minimal platform connecting skilled labor and employers instantly with transparent pay and verified trust.

                  <div className="flex items-center gap-3 pt-2">
                    <a href="https://github.com/avi778-web" target="_blank" rel="noopener noreferrer" title="LabZeck GitHub" className="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700/80 shadow-sm flex items-center justify-center text-slate-300 hover:bg-white hover:text-slate-950 hover:scale-110 transition-all duration-200">
                      <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    </a>
                    <a href="https://linkedin.com/in/your-username" target="_blank" rel="noopener noreferrer" title="LabZeck LinkedIn" className="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700/80 shadow-sm flex items-center justify-center text-slate-300 hover:bg-[#0A66C2] hover:text-white hover:scale-110 transition-all duration-200">
                      <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
                    </a>
                    <a href="https://facebook.com/your-username" target="_blank" rel="noopener noreferrer" title="LabZeck Facebook" className="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700/80 shadow-sm flex items-center justify-center text-slate-300 hover:bg-[#1877F2] hover:text-white hover:scale-110 transition-all duration-200">
                      <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    </a>
                    <a href="https://instagram.com/hey.avipal" target="_blank" rel="noopener noreferrer" title="LabZeck Instagram" className="w-10 h-10 rounded-xl bg-slate-900 border border-slate-700/80 shadow-sm flex items-center justify-center text-slate-300 hover:bg-gradient-to-tr hover:from-amber-500 hover:via-rose-500 hover:to-purple-600 hover:text-white hover:scale-110 transition-all duration-200">
                      <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

                  <h4 className="font-bold text-xs uppercase tracking-wider text-slate-200 mb-4">Company</h4>

                    <li><a href="#" className="hover:text-white">About Us</a></li>
                    <li><a href="careers.html" className="hover:text-white">Careers</a></li>
                    <li><a href="#contact" className="hover:text-white">Contact</a></li>

                <div className="grid grid-cols-3 gap-2 bg-slate-950/80 border border-slate-800 rounded-2xl p-3 mb-6 text-center">
                  <div>
                    <div className="text-[10px] text-slate-400 font-semibold uppercase">Queue</div>
                    <div className="text-sm font-extrabold text-white mt-0.5">#2</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-400 font-semibold uppercase">Status</div>
                    <div className="text-sm font-extrabold text-amber-400 mt-0.5">QUEUED</div>
                  </div>
                  <div>
                    <div className="text-[10px] text-slate-400 font-semibold uppercase">Est. Wait</div>
                    <div className="text-sm font-extrabold text-white mt-0.5">~2 hrs</div>
                  </div>
                </div>

                <button 
                  onClick={() => setShowModal(false)}
                  className="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-full shadow-lg shadow-amber-500/20 transition-all"
                >
                  Got it — Thanks!
                </button>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
